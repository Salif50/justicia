<div class="adm" [class.is-collapsed]="!sidebarOpen()">

  <div class="adm-scrim" [class.is-open]="sidebarOpen()" (click)="toggleSidebar()"></div>

  <aside class="adm-side" [class.is-open]="sidebarOpen()">
    <div class="adm-brand">
      <a routerLink="/admin" class="adm-brand-link">
        <span class="adm-mark brand-mark" aria-hidden="true"><img src="/brand/jia-mark.webp" srcset="/brand/jia-mark.webp 1x, /brand/jia-mark@2x.webp 2x" alt="" width="114" height="64" decoding="async" /></span>
        <span class="adm-brand-name">Justic<span>IA</span></span>
        <span class="adm-brand-tag">Admin</span>
      </a>
      <button class="adm-toggle" (click)="toggleSidebar()" aria-label="Réduire le menu">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <nav class="adm-nav">
      @for (group of nav; track group.label) {
        <p class="adm-nav-label">{{ group.label }}</p>
        @for (item of group.items; track item.path) {
          <a class="adm-nav-item" [routerLink]="item.path" routerLinkActive="is-active"
             [routerLinkActiveOptions]="{ exact: !!item.exact }" [title]="item.label">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" [innerHTML]="icon(item.icon)"></svg>
            <span>{{ item.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="adm-foot">
      <a routerLink="/dashboard" class="adm-nav-item adm-back" title="Retour à l'application">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Retour à l'application</span>
      </a>
      <div class="adm-user">
        <span class="adm-avatar">{{ userInitial() }}</span>
        <span class="adm-user-info">
          <strong>{{ userName() }}</strong>
          <small>{{ userEmail() }}</small>
        </span>
        <button class="adm-logout" (click)="logout()" title="Déconnexion" aria-label="Déconnexion">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="adm-main">
    <header class="adm-top">
      <button class="adm-icon-btn adm-burger" (click)="toggleSidebar()" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="adm-top-title">{{ currentPageTitle() }}</h1>
      <span class="adm-top-tag">Administration</span>
      <button class="adm-icon-btn" (click)="themeSvc.toggle()" [title]="themeSvc.isDark() ? 'Thème clair' : 'Thème sombre'">
        @if (themeSvc.isDark()) {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        } @else {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        }
      </button>
    </header>

    <main class="adm-content">
      <router-outlet />
    </main>
  </div>
</div>
