<app-header></app-header>

<section class="auth-page">
  <div class="auth-layout">

    <!-- Image hero plein écran (contenu à gauche, espace formulaire à droite) -->
    <div class="auth-visual">
      <img src="/lojusticia.png?v=1" alt="" class="auth-hero-img" />
      <div class="auth-caption">
        <p class="pub-eyebrow">Espace membre</p>
        <blockquote>Le droit guinéen, <em>à portée de main</em>, à chaque consultation.</blockquote>
      </div>
    </div>

    <!-- Formulaire — zone droite de l'image -->
    <main class="auth-form-panel">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Connexion</h1>
          <p>Connectez-vous à votre compte JusticIA</p>
        </div>

        <div class="social-login">
          <button type="button" class="btn-google" (click)="loginWithGoogle()" [disabled]="isLoading()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span>Continuer avec Google</span>
          </button>
        </div>

        <div class="auth-divider"><span>ou</span></div>

        <form (ngSubmit)="onSubmit()" class="auth-form">
          @if (error()) {
            <div class="error-message">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <span>{{ error() }}</span>
            </div>
          }

          <div class="form-row">
            <div class="form-group">
              <label for="email">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
                <span>Email</span>
              </label>
              <input
                type="email"
                id="email"
                [value]="email()"
                (input)="email.set($any($event.target).value)"
                placeholder="votre@email.com"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group">
              <label for="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>Mot de passe</span>
              </label>
              <input
                type="password"
                id="password"
                [value]="password()"
                (input)="password.set($any($event.target).value)"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" />
              <span>Se souvenir de moi</span>
            </label>
            <a href="#" class="forgot-link">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="btn-primary btn-submit" [disabled]="isLoading()">
            @if (isLoading()) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="spinner">
                <circle cx="12" cy="12" r="10"/>
              </svg>
              <span>Connexion...</span>
            } @else {
              <span>Se connecter</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            }
          </button>
        </form>

        <div class="auth-footer">
          <p>Pas encore de compte ? <a routerLink="/signup">Créer un compte</a></p>
        </div>
      </div>
    </main>

  </div>
</section>
