<div class="justicia-loader" [class.active]="active()">

  <!-- Barre de progression en haut -->
  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>

  <!-- Overlay central -->
  <div class="loader-overlay">
    <div class="loader-content">

      <!-- Balance de justice animée -->
      <div class="scales">

        <!-- Pied de la balance -->
        <div class="scales-pole">
          <div class="scales-top-jewel"></div>
        </div>

        <!-- Bras de la balance -->
        <div class="scales-beam">
          <div class="scales-beam-center"></div>

          <!-- Côté gauche -->
          <div class="scales-side left">
            <div class="scales-chain"></div>
            <div class="scales-pan">
              <div class="scales-pan-rim"></div>
            </div>
          </div>

          <!-- Côté droit -->
          <div class="scales-side right">
            <div class="scales-chain"></div>
            <div class="scales-pan">
              <div class="scales-pan-rim"></div>
            </div>
          </div>
        </div>

        <!-- Base -->
        <div class="scales-base">
          <div class="scales-base-foot"></div>
        </div>

      </div>

      <!-- Nom de la marque -->
      <div class="brand">
        <span class="brand-justic">Justic</span><span class="brand-ia">IA</span>
      </div>

      <!-- Points de chargement -->
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>
  </div>

</div>
